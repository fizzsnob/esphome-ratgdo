---
substitutions:
  id_prefix: ratgdo32
  friendly_name: "ratgdo32"
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO21
  input_obst_pin: GPIO4
  status_door_pin: GPIO26
  status_obstruction_pin: GPIO25
  dry_contact_open_pin: GPIO13
  dry_contact_close_pin: GPIO14
  dry_contact_light_pin: GPIO27

web_server:
  local: true

esphome:
  name: ${id_prefix}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.4.0
  project:
    name: ratgdo.v32board_secplusv1
    version: "34.10-personal"
  # Panel (889LM) is permanently wired on this install — never allow the
  # board to become a second transmitter on the Sec+1 bus (phantom-open
  # investigation, 2026-07-31).
  platformio_options:
    build_flags:
      - "-DRATGDO_NO_EMULATION"
    # lwIP defensive guard: crash #2 (LoadStoreError in lwip_standard_chksum
    # during RTO retransmit) walks a corrupted pbuf; the guard validates the
    # chain and drops the segment instead of crashing (one connection dies,
    # not the board). Anchored patcher, idempotent, re-applies after
    # framework package updates.
    extra_scripts:
      - pre:/Users/michaelbell/esphome-patches/apply_lwip_guard.py
  # Park the Sec+1 TX pin (GPIO17, inverted soft-UART: idle/released = LOW)
  # in the first moments of firmware life — shrinks the app-phase float
  # window after a crash reboot. The ROM/bootloader-phase window remains
  # (hardware-level; under investigation).
  on_boot:
    priority: 1000
    then:
      - lambda: |-
          gpio_reset_pin(GPIO_NUM_17);
          gpio_set_direction(GPIO_NUM_17, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_17, 0);

# Reset-reason telemetry for the phantom-open investigation: distinguishes
# brownout vs crash vs watchdog on every boot, queryable any time at
# /text_sensor/reset_reason (the log-only boot banner is missed unless a
# log client is attached at boot).
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: wifi_info
    bssid:
      name: "WiFi BSSID"
    ssid:
      name: "WiFi SSID"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
  - platform: internal_temperature
    name: "Chip Temperature"
    update_interval: 60s

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # Phantom-open root cause (2026-07-31): LoadProhibited crashes inside the
    # Wi-Fi blob's TX-error/AMPDU path (ppAMPDU2Normal via lmacProcessTxError),
    # triggered by heavy TX-retry load after power_save_mode:none (2026-07-20).
    # Each crash-reboot can glitch the Sec+1 wall-control line -> the opener
    # reads a phantom button press. AMPDU TX off removes the crashing path;
    # throughput cost is irrelevant for this device.
    sdkconfig_options:
      CONFIG_ESP_WIFI_AMPDU_TX_ENABLED: "n"
      # Heap poisoning: both crash classes point at TX-buffer/heap corruption
      # under retransmission churn. Comprehensive poisoning makes the NEXT
      # corruption crash name its culprit (poisoned-block owner) instead of
      # detonating in an innocent victim like lwIP's checksum loop.
      CONFIG_HEAP_POISONING_COMPREHENSIVE: "y"

dashboard_import:
  package_import_url: github://ratgdo/esphome-ratgdo/v32board_secplusv1.yaml@main

packages:
  # remote_package:
  #   url: https://github.com/ratgdo/esphome-ratgdo
  #   ref: main
  #   files: [base_secplusv1.yaml]
  #   refresh: 1s
  remote_package: !include
    file: base_secplusv1.yaml

switch:
  - platform: ratgdo
    id: ${id_prefix}_led
    type: led
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    name: "LED"
    entity_category: config

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

api:
  id: api_server

improv_serial:

esp32_improv:
  authorizer: none

wifi:
  # Mains-powered device: the ESP32 default LIGHT sleep naps the modem and
  # starves the /events stream (field captures: 45-59s silent gaps tripping
  # every SSE consumer's idle watchdog). Full power keeps the pings flowing.
  power_save_mode: none
  ap:
    ssid: "ratgdo"

captive_portal:

logger:
